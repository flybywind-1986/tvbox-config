name: update-tvbox-config

on:
  schedule:
    - cron: "7 */6 * * *"        # 每 6 小时跑一次（UTC）；避开整点，整点是最挤的
  workflow_dispatch:              # 也可以在网页上手动点一下
  push:
    paths:
      - "sources.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build config
        run: python scripts/build_config.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json report.md
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh source config [skip ci]"
            git push
          fi

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN 未配置，跳过 Gitee 同步（在仓库 Settings → Secrets 里加一个就能自动同步）"
            exit 0
          fi
          python scripts/push_gitee.py
