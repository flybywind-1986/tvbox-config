name: update-tvbox-config

on:
  schedule:
    - cron: "0 */6 * * *"        # 每 6 小时跑一次（UTC）
  workflow_dispatch:              # 也可以在网页上手动点一下
  push:
    paths:
      - "sources.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build config
        run: python scripts/build_config.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json report.md
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh source config [skip ci]"
            git push
          fi
